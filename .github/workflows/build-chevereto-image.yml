name: Build Chevereto Image

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Chevereto package version (e.g. 4.3.5)"
        required: false
        default: "4"
      skip_if_exists:
        description: "Skip build if image already exists in registry"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: chevereto
  IMAGE_REGISTRY: ${{ vars.CHEVERETO_IMAGE_REGISTRY || 'ghcr.io/zeroclover/chevereto' }}

jobs:
  # Prepare job: download the package once, resolve version, share via artifact
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
      tags: ${{ steps.prep.outputs.tags }}
      should_build: ${{ steps.registry.outputs.should_build || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure required secrets exist
        run: |
          if [ -z "${{ secrets.CHEVERETO_LICENSE_KEY }}" ]; then
            echo "CHEVERETO_LICENSE_KEY secret is required to fetch the pro package." >&2
            exit 1
          fi
          if [ -z "${{ secrets.CHEVERETO_DOWNLOAD_PROXY }}" ]; then
            echo "CHEVERETO_DOWNLOAD_PROXY secret is required; GitHub-hosted runner IPs are blocked by Cloudflare." >&2
            exit 1
          fi

      - name: Prepare Chevereto package
        id: prep
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          CHEVERETO_LICENSE_KEY: ${{ secrets.CHEVERETO_LICENSE_KEY }}
          CHEVERETO_DOWNLOAD_PROXY: ${{ secrets.CHEVERETO_DOWNLOAD_PROXY }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT:-4}"
          if [ -z "$VERSION" ]; then
            VERSION="4"
          fi

          # Mask every component of the proxy so it never leaks via curl output.
          if [ -n "${CHEVERETO_DOWNLOAD_PROXY:-}" ]; then
            _bare="${CHEVERETO_DOWNLOAD_PROXY#*://}"
            echo "::add-mask::${_bare}"
            echo "::add-mask::${_bare%%@*}"
            echo "::add-mask::${_bare##*@}"
          fi

          DOWNLOAD_DIR="package"
          rm -rf "$DOWNLOAD_DIR"
          mkdir -p "$DOWNLOAD_DIR"
          API_DOWNLOAD="https://chevereto.com/api/download/"

          # GitHub-hosted runner IPs are blocked by Chevereto's Cloudflare, so the
          # licensed download must egress through the proxy secret.
          echo "Downloading Chevereto package ${VERSION}"
          pushd "$DOWNLOAD_DIR" >/dev/null
          curl -fsSLJO --proxy "${CHEVERETO_DOWNLOAD_PROXY}" -H "License: ${CHEVERETO_LICENSE_KEY}" "${API_DOWNLOAD}${VERSION}"
          ZIP_NAME=$(ls -1 *.zip | head -n1)
          if [ -z "$ZIP_NAME" ]; then
            echo "Download did not produce a zip file" >&2
            exit 1
          fi
          popd >/dev/null

          VERSION_FROM_ZIP=$(printf '%s\n' "$ZIP_NAME" | sed -n "s/^chevereto_\([0-9.]*\).*$/\1/p")
          VERSION_FROM_ZIP=${VERSION_FROM_ZIP#v}
          VERSION_FROM_ZIP=${VERSION_FROM_ZIP#V}
          if [ -z "$VERSION_FROM_ZIP" ]; then
            echo "Unable to determine Chevereto version from $ZIP_NAME" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<<"$VERSION_FROM_ZIP"
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          TAG_LIST="$MAJOR $MAJOR.${MINOR} $MAJOR.${MINOR}.${PATCH}"
          {
            printf 'version=%s\n' "$VERSION_FROM_ZIP"
            printf 'tags=%s\n' "$TAG_LIST"
          } >>"$GITHUB_OUTPUT"

      - name: Show resolved version
        run: |
          echo "Resolved package version: ${{ steps.prep.outputs.version }}"

      - name: Login to GHCR for registry check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_if_exists == 'true')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing registry version
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_if_exists == 'true')
        id: registry
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          PACKAGE_VERSION: ${{ steps.prep.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY="${IMAGE_REGISTRY:-ghcr.io/zeroclover/chevereto}"
          REGISTRY="${REGISTRY#https://}"
          REGISTRY="${REGISTRY#http://}"

          echo "Checking if image ${REGISTRY}:${PACKAGE_VERSION} exists"

          # Use docker manifest inspect to check if the image with current version exists
          SHOULD_BUILD=true
          if docker manifest inspect "${REGISTRY}:${PACKAGE_VERSION}" >/dev/null 2>&1; then
            echo "Image ${REGISTRY}:${PACKAGE_VERSION} already exists in registry"
            SHOULD_BUILD=false
          else
            echo "Image ${REGISTRY}:${PACKAGE_VERSION} not found in registry, will build"
          fi

          {
            printf 'latest_tag=%s\n' "$PACKAGE_VERSION"
            if [ "$SHOULD_BUILD" = true ]; then
              printf 'should_build=true\n'
            else
              printf 'should_build=false\n'
            fi
          } >>"$GITHUB_OUTPUT"

          if [ "$SHOULD_BUILD" != true ]; then
            echo "Registry already has the current package version; skipping build."
          fi

      - name: Skip build (already up-to-date)
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_if_exists == 'true')) && steps.registry.outputs.should_build == 'false'
        run: echo "Chevereto image already up to date on registry."

      - name: Upload Chevereto package
        if: steps.registry.outputs.should_build != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: chevereto-package
          path: package/*.zip
          if-no-files-found: error
          retention-days: 1

  # Multi-architecture build job
  build:
    needs: prepare
    if: (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || (github.event_name == 'schedule' && needs.prepare.outputs.should_build == 'true') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.skip_if_exists != 'true' || needs.prepare.outputs.should_build == 'true'))
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Chevereto package
        uses: actions/download-artifact@v8
        with:
          name: chevereto-package
          path: package
          digest-mismatch: warn

      - name: Unpack Chevereto package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME=$(ls -1 package/*.zip | head -n1)
          if [ -z "$ZIP_NAME" ]; then
            echo "Package artifact did not contain a zip file" >&2
            exit 1
          fi
          rm -rf chevereto
          mkdir -p chevereto
          unzip -oq "$ZIP_NAME" -d chevereto
          rm -rf package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
          flavor: |
            latest=false

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE_REGISTRY }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "${{ env.IMAGE_REGISTRY }}@${digest}" > "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge job to create multi-arch manifest
  merge:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    if: (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || (github.event_name == 'schedule' && needs.prepare.outputs.should_build == 'true') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.skip_if_exists != 'true' || needs.prepare.outputs.should_build == 'true'))
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
          digest-mismatch: warn

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          REGISTRY="${IMAGE_REGISTRY:-ghcr.io/zeroclover/chevereto}"
          REGISTRY="${REGISTRY#https://}"
          REGISTRY="${REGISTRY#http://}"
          if [[ "$REGISTRY" != */* ]]; then
            echo "IMAGE_REGISTRY must include an image path (e.g. ghcr.io/owner/chevereto)." >&2
            exit 1
          fi
          IMAGE_REPO="${REGISTRY,,}"

          read -ra TAG_LIST <<<"${TAGS}"

          # Build tag arguments
          TAG_ARGS=()
          for tag in "${TAG_LIST[@]}"; do
            TAG_ARGS+=("--tag" "${IMAGE_REPO}:${tag}")
          done

          # Build source digest arguments
          DIGEST_ARGS=($(cat * | tr '\n' ' '))

          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_ARGS[@]}"

      - name: Inspect image
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          REGISTRY="${IMAGE_REGISTRY:-ghcr.io/zeroclover/chevereto}"
          REGISTRY="${REGISTRY#https://}"
          REGISTRY="${REGISTRY#http://}"
          IMAGE_REPO="${REGISTRY,,}"
          docker buildx imagetools inspect "${IMAGE_REPO}:${PACKAGE_VERSION}"
